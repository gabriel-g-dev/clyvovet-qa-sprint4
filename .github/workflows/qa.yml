name: QA de sistema — Sprint 4
on:
  push:
    branches: [develop]
    paths: ['automation/**', 'scripts/**', 'package*.json', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sistema:
    name: Java — interface e HTTP (${{ matrix.viewport }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar ferramenta e navegador
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Preparar aplicação real no commit fixado
        run: npm run prepare:app
      - name: Executar cenários reais com assertions e vídeo
        env:
          QA_VIEWPORT: ${{ matrix.viewport }}
          QA_DEMO: 'true'
        run: npm test
      - name: Preservar relatório, requisições, capturas e gravações
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-${{ matrix.viewport }}
          path: artifacts/${{ matrix.viewport }}/
          retention-days: 90
          if-no-files-found: warn
