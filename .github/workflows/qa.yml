name: QA de sistema — Sprint 4
on:
  push:
    branches: [develop]
    paths: ['automation/**', 'scripts/**', 'package*.json', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sistema:
    name: Java — interface e HTTP (${{ matrix.viewport }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        viewport: [desktop, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: scripts/prepare.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Reutilizar navegador da versão fixada
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-1.62.1
      - name: Instalar ferramenta e navegador
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Preparar aplicação real no commit fixado
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run prepare:app 2>&1 | tee artifacts/prepare.log
      - name: Executar desktop com gravação contínua do navegador
        if: matrix.viewport == 'desktop'
        env:
          QA_HEADED: 'true'
          QA_DEMO: 'true'
          QA_RECORD: 'true'
        run: |
          node node_modules/ffmpeg-static/install.js
          command -v xvfb-run
          xvfb-run -a -s '-screen 0 1600x1000x24' npm test
      - name: Executar no viewport mobile
        if: matrix.viewport == 'mobile'
        env:
          QA_VIEWPORT: ${{ matrix.viewport }}
        run: npm test
      - name: Verificar vídeo contínuo, codec e duração
        if: matrix.viewport == 'desktop'
        run: python3 scripts/make-video.py artifacts/desktop
      - name: Reexecutar os mesmos 19 cenários em ordem inversa e H2 novo
        if: matrix.viewport == 'desktop'
        env:
          QA_ORDER: reverse
        run: npm test
      - name: Preservar relatório, requisições, capturas e gravações
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-${{ matrix.viewport }}
          path: |
            artifacts/${{ matrix.viewport }}/
            artifacts/${{ matrix.viewport }}-reverse/
            artifacts/prepare.log
          retention-days: 90
          if-no-files-found: warn
  regressao-dotnet:
    name: Regressão preexistente .NET — unitários e integração SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Obter fonte sem modificar o repositório da disciplina
        run: |
          git clone https://github.com/gabriel-g-dev/ClyvoVetApi.git .work/dotnet
          git -C .work/dotnet checkout --detach 83b6dd76b55e471d5f5344f60a80f3617f3f9928
      - name: Executar suítes existentes (não contam como novos testes de sistema)
        run: |
          dotnet test .work/dotnet/ClyvoVetApi.Tests.Unit --logger trx --results-directory artifacts/dotnet/unit
          dotnet test .work/dotnet/ClyvoVetApi.Tests.Integration --logger trx --results-directory artifacts/dotnet/integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regressao-dotnet
          path: artifacts/dotnet/
          retention-days: 90
